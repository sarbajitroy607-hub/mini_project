{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><div class="eyebrow">SECURE ACCOUNT</div><h1>Account Security</h1><p>Update your administrator credentials.</p></div></div>
<div class="grid-2"><div class="cardx card-pad"><h2 style="font-size:14px">Change password</h2>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="form-label">Current password</label><input class="form-control" type="password" name="old_password" required>
    <label class="form-label">New password</label><input class="form-control" type="password" name="new_password" placeholder="6+ characters" required>
    <button class="btnx primary" style="margin-top:14px">Update password</button>
  </form></div></div>
{% endblock %}
